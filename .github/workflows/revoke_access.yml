name: "IssueOps: Wygaszanie dostępu praktykantów"

on:
  schedule:
    # Codziennie o północy (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tryb testowy na sucho (dry-run, bez modyfikacji uprawnień)"
        required: false
        type: boolean
        default: false
      force_user:
        description: "Wymuś natychmiastowe odebranie uprawnień dla wskazanego usera (login)"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  administration: write   # wymagane do DELETE /repos/.../collaborators (bez PAT)

jobs:
  revoke:
    name: "Weryfikacja i odbieranie wygasłych uprawnień"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: ⚙️ Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ⏰ Weryfikacja terminów ważności i odebranie dostępu
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN != '' && secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE_USER: ${{ inputs.force_user || '' }}
        run: |
          node .github/scripts/revoke_access.js

      - name: 💾 Zapisanie zaktualizowanego stanu data/interns.json
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/interns.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(issueops): wygaszono uprawnienia praktykantów [skip ci]"
            git pull --rebase origin main || git pull --rebase
            git push origin HEAD:main
          else
            echo "Brak zmian w pliku data/interns.json."
          fi
